# CodexAstraUlt: Host-only admitted native execution reuses the existing runtime
# and ABI; no desktop frontend, new cryptographic stack or Android dependency.
[package]
name = "droidds-native-title-tools"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "droidds-native-title"
path = "src/main.rs"

[dependencies]
zakuro-core.workspace = true
zakuro-fs.workspace = true
zakuro-cpu.workspace = true
zakuro-common.workspace = true
recomp-abi.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
memmap2.workspace = true

[dev-dependencies]
droidds-runtime-probe = { path = "../droidds-runtime-probe", features = ["producer"] }
