# CodexAstraUlt: A small Android-loadable CPU proof reuses the upstream ABI and
# exact original Linux fixtures without pulling the desktop compiler onto a phone.
[package]
name = "droidds-android-probe"
# CodexAstraUlt: Keep the CPU report version aligned with its Vulkan-capable shell.
version = "0.0.6"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "DroidDS packaged synthetic CPU loader probe"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# CodexAstraUlt: Run the original guest through actual loader/services/PICA.
droidds-runtime-probe = { path = "../droidds-runtime-probe" }
droidds-foundation = { path = "../droidds-foundation", default-features = false }
recomp-abi.workspace = true
serde_json.workspace = true
libc.workspace = true
