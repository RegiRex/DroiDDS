# CodexAstraUlt: Public CI runs only original CPU fixtures and source dependencies.
# No game data, title-derived package or binary publication is part of this gate.
name: CPU foundation

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "upstream.lock.toml"
      - "crates/**"
      - "vendor/**"
      - "tools/**"
      - ".github/workflows/foundation.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-cpu-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RUSTUP_TOOLCHAIN: "1.95.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
      - name: Test dependency pin checks
        id: python
        shell: bash
        run: python3 -m unittest discover -s tools/tests -v 2>&1 | tee "$RUNNER_TEMP/foundation-python.log"
      - name: Record bounded Python failure
        if: failure() && steps.python.outcome == 'failure'
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, sys
          from pathlib import Path
          # CodexAstraUlt: A failed first Python gate has no build report. Keep
          # its actual traceback tail short enough to survive annotation limits.
          path = Path(os.environ["RUNNER_TEMP"]) / "foundation-python.log"
          detail = "Python validation failed before writing its log"
          if path.is_file() and not path.is_symlink():
              with path.open("rb") as stream:
                  stream.seek(0, 2)
                  stream.seek(max(0, stream.tell() - 12000))
                  detail = stream.read(12000).decode("utf-8", errors="replace")[-3000:]
          detail = re.sub(r"(https?://)[^/\s@]+@", r"\1[redacted]@", detail)
          detail = re.sub(r"\b(?:gh[pousr]_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+)\b", "[redacted]", detail)[-3000:]
          escaped = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error::Python validation: " + escaped, file=sys.stderr)
          PY
      - name: Build and exercise CPU foundation
        id: foundation
        shell: bash
        run: python3 tools/build_foundation.py --output out/ci-foundation --jobs 2 2>&1 | tee "$RUNNER_TEMP/foundation-build.log"
      # CodexAstraUlt: Require real original-input preparation in CI, including
      # the coordinator; unit-only success cannot stand in for a prepared title.
      - name: Verify native source preparation with original inputs
        run: |
          cargo fmt -p droidds-title-builder -- --check
          cargo clippy --locked -p droidds-title-builder --all-targets --no-deps -- -D warnings
          cargo test --locked -p droidds-title-builder -- --test-threads=1
          cargo build --locked --release -p droidds-title-builder
          python3 tools/tests/test_prepare_private_title.py --worker target/release/droidds-prepare-title -v
      # CodexAstraUlt: Link and statically audit actual original prepared C;
      # compilation must not load a generated library or qualify private games.
      - name: Verify bounded native compilation with original inputs
        run: python3 tools/tests/test_compile_private_title.py --worker target/release/droidds-prepare-title -v
      # CodexAstraUlt: Require real admitted native execution and fail-stop fence
      # regressions before exposing the host-only private comparison procedure.
      - name: Verify guarded native host execution with original inputs
        run: |
          cargo fmt -p droidds-native-title-tools -- --check
          cargo clippy --locked -p droidds-native-title-tools --all-targets --no-deps -- -D warnings
          cargo test --locked -p zakuro-core -p droidds-title-tools -p droidds-native-title-tools -- --test-threads=1
          cargo build --locked --release -p droidds-native-title-tools
          cargo build --locked --release -p droidds-runtime-probe --features producer
          python3 tools/check_native_title_pipeline.py --output "$RUNNER_TEMP/droidds-native-host-original"
      - name: Record result in job summary
        if: always()
        shell: bash
        env:
          FOUNDATION_OUTCOME: ${{ steps.foundation.outcome }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, re, sys
          from pathlib import Path
          # CodexAstraUlt: Read one bounded ordinary step log, never a command
          # array or arbitrary report path. Retain the final failure lines.
          def tail(path, limit=2500):
              if path.is_symlink() or not path.is_file():
                  return ""
              with path.open("rb") as stream:
                  stream.seek(0, 2)
                  stream.seek(max(0, stream.tell() - limit))
                  return stream.read(limit).decode("utf-8", errors="replace")
          def redact(value):
              value = re.sub(r"(https?://)[^/\s@]+@", r"\1[redacted]@", value)
              return re.sub(r"\b(?:gh[pousr]_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+)\b", "[redacted]", value)
          base = Path("out/ci-foundation")
          path = base / "build-report.json"
          report = {}
          if not path.is_symlink() and path.is_file() and path.stat().st_size <= 2 * 1024 * 1024:
              try:
                  report = json.loads(path.read_text())
              except (OSError, ValueError):
                  pass
          print("CPU foundation status:", report.get("status", os.environ["FOUNDATION_OUTCOME"]))
          for step in report.get("steps", []):
              if "tests" in step:
                  print(f"- {step['step']}: {step['tests']}")
          if os.environ["FOUNDATION_OUTCOME"] == "failure":
              detail = str(report.get("error", "Foundation failed before writing a valid report"))[-400:]
              failed = [step for step in report.get("steps", []) if step.get("exit_code", 0) != 0]
              name = failed[-1].get("log", "") if failed else ""
              log = tail(base / name) if name and Path(name).name == name and name.endswith(".log") else ""
              detail = redact(detail + "\n" + (log or tail(Path(os.environ["RUNNER_TEMP"]) / "foundation-build.log")))[-3000:]
              print("Failure:", detail)
              escaped = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::error::CPU foundation: " + escaped, file=sys.stderr)
          print("Linux synthetic CPU evidence only; Android and game compatibility are untested.")
          PY
