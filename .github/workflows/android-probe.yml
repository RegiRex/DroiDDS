# CodexAstraUlt: Cross-build the original CPU and full-runtime diagnostic, then
# execute its host Vulkan gates. These are not Android device/game measurements.
name: Android runtime probe

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "upstream.lock.toml"
      - "crates/**"
      - "vendor/**"
      - "android/probe/**"
      - "tools/**"
      - ".github/workflows/android-probe.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-cross-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RUSTUP_TOOLCHAIN: "1.95.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned toolchains
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
          rustup target add --toolchain 1.95.0 aarch64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724"
      - name: Test evidence and device boundaries
        id: python
        shell: bash
        run: |
          python3 -m unittest discover -s tools/tests -v 2>&1 | tee "$RUNNER_TEMP/android-python.log"
      - name: Record bounded Python failure
        if: failure() && steps.python.outcome == 'failure'
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, sys
          from pathlib import Path
          # CodexAstraUlt: Python failures occur before an APK report exists.
          # Keep the final traceback within the visible annotation instead of
          # placing it after thousands of successful test names; omit key logs.
          path = Path(os.environ["RUNNER_TEMP"]) / "android-python.log"
          if path.is_file() and not path.is_symlink():
              with path.open("rb") as stream:
                  stream.seek(0, 2)
                  stream.seek(max(0, stream.tell() - 12000))
                  detail = stream.read(12000).decode("utf-8", errors="replace")[-3000:]
          else:
              detail = "Python validation failed before writing its log"
          detail = re.sub(r"(https?://)[^/\s@]+@", r"\1[redacted]@", detail)
          detail = re.sub(r"\b(?:gh[pousr]_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+)\b", "[redacted]", detail)[-3000:]
          escaped = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error::Python validation: " + escaped, file=sys.stderr)
          PY
      - name: Build and audit Android probe
        shell: bash
        run: |
          python3 tools/build_android_probe.py --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME_17_X64" --output out/ci-android-probe --jobs 2
      # CodexAstraUlt: Exercise real Vulkan draws with the software driver on CI;
      # this qualifies the shared test logic, not Android or Thor performance.
      - name: Execute host Vulkan readback
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers vulkan-validationlayers
          drivers=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test "${#drivers[@]}" -eq 1
          test -f "${drivers[0]}"
          export VK_DRIVER_FILES="${drivers[0]}"
          export VK_LAYER_ENABLES=VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/droidds-vulkan"
          mkdir -m 700 -p "$XDG_RUNTIME_DIR"
          python3 tools/build_vulkan_probe.py --ndk "$ANDROID_HOME/ndk/27.3.13750724" --output out/ci-vulkan --require-validation
      # CodexAstraUlt: Run the actual loader/services/PICA path and all required
      # GPU comparisons with validation, including Thor's static-state route.
      - name: Execute integrated runtime and strict GPU suites
        id: runtime
        shell: bash
        run: |
          drivers=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test "${#drivers[@]}" -eq 1
          test -f "${drivers[0]}"
          export VK_DRIVER_FILES="${drivers[0]}"
          export VK_LAYER_ENABLES=VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/droidds-vulkan"
          export PATH="$ANDROID_HOME/ndk/27.3.13750724/shader-tools/linux-x86_64:$PATH"
          python3 tools/build_runtime_probe.py --output out/ci-runtime --jobs 2 2>&1 | tee out/ci-runtime-console.log
      - name: Record bounded runtime failure
        if: failure() && steps.runtime.outcome == 'failure'
        shell: bash
        run: |
          python3 - <<'PYRUNTIME'
          import json, re, sys
          from pathlib import Path
          # CodexAstraUlt: Preserve useful public diagnostics without credentials
          # or raw artifacts; only this original runtime gate's bounded tail.
          base = Path("out/ci-runtime")
          report_path = base / "build-report.json"
          detail = "Runtime gate failed before writing its report"
          if report_path.is_file() and not report_path.is_symlink():
              report = json.loads(report_path.read_text())
              detail = str(report.get("error", detail))[-2000:]
              failed = [item for item in report.get("steps", [])
                        if item.get("exit_code", 0) != 0 or item.get("status") == "inconclusive"]
              for item in failed[-1:]:
                  name = item.get("log", "")
                  path = base / name
                  if Path(name).name == name and path.is_file() and not path.is_symlink():
                      with path.open("rb") as stream:
                          stream.seek(0, 2)
                          stream.seek(max(0, stream.tell() - 5000))
                          detail += "\n" + stream.read(5000).decode("utf-8", errors="replace")
          detail = re.sub(r"(https?://)[^/\s@]+@", r"\1[redacted]@", detail)
          detail = re.sub(r"\b(?:gh[pousr]_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+)\b", "[redacted]", detail)
          escaped = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error::Runtime validation: " + escaped, file=sys.stderr)
          PYRUNTIME
      - name: Record build result
        if: always()
        shell: bash
        run: |
          if [ -f out/ci-android-probe/build-report.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          from pathlib import Path
          report = json.loads(Path("out/ci-android-probe/build-report.json").read_text())
          print("Android probe build:", report["status"])
          print("Actual Android execution:", report["runtime_status"])
          print("APK SHA256:", report.get("apk_sha256", "not produced"))
          if "error" in report:
              print("Failure:", report["error"])
              # CodexAstraUlt: Preserve a useful failure reason in the check
              # summary without publishing binary artifacts or credentials.
              detail = str(report["error"])
              escaped = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::error::" + escaped, file=sys.stderr)
          # CodexAstraUlt: Main-branch checks remain audit-only; deliberate probe
          # tags use the separate verified prerelease publication workflow.
          print("Audit-only build. Downloadable probes are published by the separate tag workflow.")
          PY
          fi
